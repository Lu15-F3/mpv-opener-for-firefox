<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MPV Firefox Opener - Setup</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>

  <div class="lang-selector">
    <button id="btn-en" class="lang-btn">English</button>
    <button id="btn-pt" class="lang-btn">Português (BR)</button>
  </div>

  <div class="card">
    <h1 id="welcome-title"></h1>
    <p id="welcome-intro"></p>
    
    <div class="step-container">
      <h3 id="step1-title"></h3>
      <p id="step1-desc"></p>
      <div class="code-wrapper">
        <span class="code-text" id="cmd-deps">sudo dnf install mpv yt-dlp mpv-mpris</span>
        <button class="copy-btn" id="btn-copy-deps" data-target="cmd-deps"></button>
      </div>

      <h3 id="step2-title"></h3>
      <p id="step2-desc"></p>
      <div class="code-wrapper">
        <span class="code-text" id="cmd-host">curl -sSL https://raw.githubusercontent.com/Lu15-F3/mpv-opener-for-firefox/main/install.sh | bash</span>
        <button class="copy-btn" id="btn-copy-host" data-target="cmd-host"></button>
      </div>
    </div>
    <p class="footer-note" id="welcome-footer"></p>
  </div>

  <script src="welcome.js"></script>
</body>
</html>
