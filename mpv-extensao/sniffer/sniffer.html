<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MPV Opener - Link Sniffer</title>
  <link rel="stylesheet" href="sniffer.css">
</head>
<body>
  <div class="sniffer-container">
    <div class="header">
      <img src="../icons/icon-48.png" alt="MPV Opener" class="header-icon">
      <h2 id="txt-sniff-title">Media Link Sniffer</h2>
    </div>
    <div class="status" id="status-msg"></div>
    
    <div class="sniffer-controls">
      <h3 id="txt-sniff-subtitle">Captured Streams</h3>
      <div class="sniffer-actions">
        <button id="export-btn" class="btn-secondary">Export All</button>
        <button id="clear-btn" class="btn-danger">Clear All</button>
        <button id="send-all-btn" class="btn-primary">Send All</button>
      </div>
    </div>
    
    <div id="links-container"></div>
  </div>
  
  <script src="sniffer.js"></script>
</body>
</html>
