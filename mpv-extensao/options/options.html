<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../icons/icon-48.png" alt="MPV Opener" class="header-icon">
      <h1 id="title-settings">MPV Opener Settings</h1>
    </div>
    
    <div class="section">
      <h2 id="header-playback">Playback Settings</h2>
      <div class="form-group">
        <label id="label-display" for="displayMode">Display Mode:</label>
        <select id="displayMode">
          <option value="standard" id="opt-standard">Standard Window</option>
          <option value="fullscreen" id="opt-fullscreen">Fullscreen</option>
          <option value="pip" id="opt-pip">Picture-in-Picture</option>
        </select>
      </div>

      <!-- PiP Settings (mostra apenas quando pip está selecionado) -->
      <div id="pip-settings-options" style="display:none; margin-top: 12px; padding: 12px; background: var(--bg-color); border-radius: var(--border-radius); border: 1px solid var(--border-color);">
        <div class="form-group">
          <label for="pipCorner" data-i18n="pipCorner">PiP Corner:</label>
          <select id="pipCorner">
            <option value="topLeft" data-i18n="pipTopLeft">Top Left</option>
            <option value="topRight" data-i18n="pipTopRight">Top Right</option>
            <option value="bottomLeft" data-i18n="pipBottomLeft">Bottom Left</option>
            <option value="bottomRight" data-i18n="pipBottomRight" selected>Bottom Right</option>
          </select>
        </div>
        <div class="form-group">
          <label for="pipSize" data-i18n="pipSize">Size:</label>
          <select id="pipSize">
            <option value="15" data-i18n="pipSizeSmall">Small (15%)</option>
            <option value="20" data-i18n="pipSizeMedium">Medium (20%)</option>
            <option value="25" data-i18n="pipSizeDefault" selected>Default (25%)</option>
            <option value="30" data-i18n="pipSizeLarge">Large (30%)</option>
            <option value="40" data-i18n="pipSizeXL">Extra Large (40%)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label id="label-state" for="initialState">Initial State:</label>
        <select id="initialState">
          <option value="playing" id="opt-playing">Playing</option>
          <option value="paused" id="opt-paused">Paused</option>
        </select>
      </div>
    </div>
    
    <!-- Nova seção para Volume -->
    <div class="section">
      <h2 id="header-volume">Volume Settings</h2>
      <div class="form-group">
        <label id="label-initialVolume" for="initialVolume">Initial Volume:</label>
        <select id="initialVolume">
          <option value="0" id="opt-volumeMuted">Muted (0%)</option>
          <option value="20" id="opt-volumeLow">Low (20%)</option>
          <option value="50" id="opt-volumeMedium" selected>Medium (50%)</option>
          <option value="80" id="opt-volumeHigh">High (80%)</option>
          <option value="100" id="opt-volumeFull">Full (100%)</option>
          <option value="custom" id="opt-volumeCustom">Custom (%)</option>
        </select>
      </div>
      <div class="form-group" id="custom-volume-group" style="display:none;">
        <label for="customVolume">Custom Volume:</label>
        <input type="number" id="customVolume" min="0" max="100" value="30" placeholder="e.g., 30">
      </div>
    </div>

    <div class="section">
      <h2 id="header-quality">Quality & Stream Filters</h2>
      <div class="form-group">
        <label id="label-maxResolution" for="maxResolution">Maximum Stream Resolution:</label>
        <select id="maxResolution">
          <option value="best">Best Quality Available</option>
          <option value="1080">1080p Full HD</option>
          <option value="720">720p HD</option>
          <option value="480">480p SD</option>
        </select>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="autoSubtitles">
        <label for="autoSubtitles" id="label-autoSubtitles">Auto-load embedded subtitles</label>
      </div>
    </div>
    
    <div class="section">
      <h2 id="header-fedora">Fedora & KDE Plasma Integration</h2>
      <div class="checkbox-group">
        <input type="checkbox" id="inhibitSleep" checked>
        <label for="inhibitSleep" id="label-inhibitSleep">Inhibit screensaver and system sleep</label>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="aggressiveCache">
        <label for="aggressiveCache" id="label-aggressiveCache">Enable aggressive network cache</label>
      </div>
    </div>
    
    <div class="section">
      <h2 id="header-window">Window Behavior</h2>
      <div class="checkbox-group">
        <input type="checkbox" id="alwaysOnTop">
        <label for="alwaysOnTop" id="label-alwaysOnTop">Keep mpv window always on top</label>
      </div>
    </div>
    
    <div class="section">
      <h2 id="header-audio">Audio Device Configuration</h2>
      <div class="form-group-vertical">
        <label id="label-audioDevice" for="audioDevice">Default Audio Output Device</label>
        <input type="text" id="audioDevice" placeholder="e.g., alsa/hdmi, pulse/device_name">
      </div>
    </div>
    
    <div class="section">
      <h2 id="header-tab">Tab Behavior</h2>
      <div class="checkbox-group">
        <input type="checkbox" id="closeTab">
        <label for="closeTab" id="label-close">Close tab automatically after sending</label>
      </div>
    </div>
    
    <div class="section">
      <h2 id="header-queue">Queue Settings</h2>
      <div class="checkbox-group">
        <input type="checkbox" id="queueModeEnabled" checked>
        <label for="queueModeEnabled" id="label-queueMode">Enable Queue Mode</label>
      </div>
    </div>
    
    <!-- Seção de History Cleanup -->
    <div class="section">
      <h2 id="header-history">History Settings</h2>
      
      <div class="form-group">
        <label id="label-historyCleanup" for="historyCleanupMode">Auto Cleanup History:</label>
        <select id="historyCleanupMode">
          <option value="manual" id="opt-cleanupManual">Manual (Disabled)</option>
          <option value="daily" id="opt-cleanupDaily">Every Day</option>
          <option value="weekly" id="opt-cleanupWeekly">Every Week</option>
          <option value="monthly" id="opt-cleanupMonthly">Every Month</option>
          <option value="onClose" id="opt-cleanupOnClose">On Browser Close</option>
        </select>
      </div>
      
      <div class="form-group" id="retention-group">
        <label id="label-historyRetention" for="historyRetention">Keep Last:</label>
        <select id="historyRetention">
          <option value="0" id="opt-retentionAll">Clear All (0 items)</option>
          <option value="5" id="opt-retention5">5 items</option>
          <option value="10" id="opt-retention10" selected>10 items</option>
          <option value="20" id="opt-retention20">20 items</option>
          <option value="50" id="opt-retention50">50 items</option>
          <option value="100" id="opt-retention100">100 items</option>
          <option value="-1" id="opt-retentionNoLimit">No Limit (Keep All)</option>
        </select>
      </div>
      
      <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center;">
        <button id="cleanup-now-btn" class="btn-warning" style="padding: 6px 14px; font-size: 12px; border-radius: var(--border-radius); border: none; cursor: pointer; background: linear-gradient(135deg, var(--accent-color), #565f89); color: var(--text-color);">
          🧹 Clean Now
        </button>
        <span id="cleanup-status" style="font-size: 12px; color: var(--text-muted);"></span>
      </div>
    </div>

    <button id="save-btn" class="btn-save">Save Settings</button>
    <div id="status" class="status-msg"></div>
    
    <div class="footer-links">
      <a href="https://addons.mozilla.org/pt-BR/firefox/addon/mpv-opener-for-firefox/" target="_blank" class="footer-link">
        Add-on Store
      </a>
      <a href="https://github.com/Lu15-F3/mpv-opener-for-firefox" target="_blank" class="footer-link">
        GitHub
      </a>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
